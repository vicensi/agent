version: 2

models:
  - name: dim_customers_kpis
    description: >
      Dimensão enriquecida de clientes com KPIs de negócio para BI.
      1 linha por customer_id — snapshot diário do estado atual do cliente.
      Cobre RFM, tendência de receita, atividade, devoluções e segmentação automática.
      Fonte: fct_orders (pedidos entregues) + dim_customers (dados cadastrais).
      Consumo direto no Looker Studio via role agent_readonly.
    config:
      tags: ["mart", "dim", "customers", "daily", "bi"]
      contract:
        enforced: true

    columns:

      # ── IDENTIFICAÇÃO ────────────────────────────────────────────────────────

      - name: customer_id
        data_type: int64
        description: "PK — identificador único do cliente."
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique

      - name: state
        data_type: string
        description: "UF do cliente (normalizada pelo macro normalize_estado no staging)."

      - name: customer_zip
        data_type: string
        description: "CEP do cliente (pode conter nulos — ~12% da fonte tem CEP ausente)."

      # ── RECÊNCIA (R) ──────────────────────────────────────────────────────────

      - name: last_order_date
        data_type: date
        description: "Data do último pedido entregue."
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: first_order_date
        data_type: date
        description: "Data do primeiro pedido entregue."
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: days_since_last_order
        data_type: int64
        description: "Dias desde o último pedido entregue até hoje. Base do score R e do activity_status."
        constraints:
          - type: not_null
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: customer_lifespan_days
        data_type: int64
        description: "Dias entre o primeiro e o último pedido entregue. Zero para clientes com apenas 1 compra."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      # ── FREQUÊNCIA (F) ────────────────────────────────────────────────────────

      - name: total_orders
        data_type: int64
        description: "Total de pedidos entregues na vida do cliente."
        constraints:
          - type: not_null
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

      - name: active_months
        data_type: int64
        description: "Quantidade de meses distintos com ao menos 1 pedido entregue."

      - name: avg_days_between_orders
        data_type: float64
        description: >
          Intervalo médio em dias entre pedidos consecutivos.
          Zero para clientes com apenas 1 pedido (sem intervalo calculável).
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      # ── MONETÁRIO (M) ────────────────────────────────────────────────────────

      - name: lifetime_revenue_brl
        data_type: numeric
        description: "Receita total acumulada do cliente (apenas pedidos entregues), em BRL."
        constraints:
          - type: not_null
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: avg_order_value_brl
        data_type: numeric
        description: >
          Ticket médio do cliente ao longo de toda a vida (pedidos entregues), em BRL.
          NÃO-ADITIVO — AVG pré-calculado por cliente. Usar AVG(avg_order_value_brl) no Looker
          retorna média de médias (errado para ticket geral). Para ticket médio global,
          use fct_orders com AVG(total_amount_brl).
        meta:
          bi_aggregation: "non_additive"
          bi_replacement: "Use fct_orders — AVG(total_amount_brl)"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: max_order_value_brl
        data_type: numeric
        description: "Maior valor de pedido individual entregue pelo cliente, em BRL."

      # ── JANELAS TEMPORAIS ─────────────────────────────────────────────────────
      # ⚠ AVISO: campos calculados com CURRENT_DATE() no momento do dbt run.
      # Com dados históricos (fim em 2024-12-30), todos retornam 0 em produção atual.
      # Para análise de período no Looker Studio: use filtro de data sobre fct_orders.

      - name: orders_last_30d
        data_type: int64
        description: >
          Pedidos entregues nos últimos 30 dias (relativo ao dbt run).
          ⚠ Retorna 0 com dados históricos — use filtro de data no Looker sobre fct_orders.
        meta:
          bi_aggregation: "non_additive"
          bi_warning: "CURRENT_DATE() — valor zero com dados históricos"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: revenue_last_30d
        data_type: numeric
        description: >
          Receita de pedidos entregues nos últimos 30 dias, em BRL (relativo ao dbt run).
          ⚠ Retorna 0 com dados históricos — use filtro de data no Looker sobre agg_daily_revenue.
        meta:
          bi_aggregation: "non_additive"
          bi_warning: "CURRENT_DATE() — valor zero com dados históricos"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: orders_last_60d
        data_type: int64
        description: "Pedidos entregues nos últimos 60 dias (relativo ao dbt run). ⚠ Ver aviso de janelas temporais acima."
        meta:
          bi_warning: "CURRENT_DATE() — valor zero com dados históricos"

      - name: revenue_last_60d
        data_type: numeric
        description: "Receita dos últimos 60 dias, em BRL (relativo ao dbt run). ⚠ Ver aviso de janelas temporais acima."
        meta:
          bi_warning: "CURRENT_DATE() — valor zero com dados históricos"

      - name: orders_last_90d
        data_type: int64
        description: "Pedidos entregues nos últimos 90 dias (relativo ao dbt run). ⚠ Ver aviso de janelas temporais acima."
        meta:
          bi_warning: "CURRENT_DATE() — valor zero com dados históricos"

      - name: revenue_last_90d
        data_type: numeric
        description: "Receita dos últimos 90 dias, em BRL (relativo ao dbt run). ⚠ Ver aviso de janelas temporais acima."
        meta:
          bi_warning: "CURRENT_DATE() — valor zero com dados históricos"

      # ── TENDÊNCIA ─────────────────────────────────────────────────────────────

      - name: revenue_last_4w
        data_type: numeric
        description: "Receita das últimas 4 semanas (dias -28 a hoje), em BRL. ⚠ Ver aviso de janelas temporais acima."
        meta:
          bi_warning: "CURRENT_DATE() — valor zero com dados históricos"

      - name: revenue_prev_4w
        data_type: numeric
        description: "Receita das 4 semanas anteriores (dias -56 a -29), em BRL. ⚠ Ver aviso de janelas temporais acima."
        meta:
          bi_warning: "CURRENT_DATE() — valor zero com dados históricos"

      - name: revenue_trend_pct
        data_type: float64
        description: >
          Variação percentual da receita: últimas 4 semanas vs 4 semanas anteriores.
          Positivo = crescimento. Negativo = queda. NULL = sem histórico suficiente.
          Fórmula: (revenue_last_4w - revenue_prev_4w) / revenue_prev_4w * 100.
          ⚠ Retorna NULL com dados históricos (revenue_last_4w e revenue_prev_4w = 0).
        meta:
          bi_warning: "CURRENT_DATE() — NULL com dados históricos"

      # ── DEVOLUÇÕES ────────────────────────────────────────────────────────────

      - name: total_returned_orders
        data_type: int64
        description: "Total de pedidos com devolução (has_return = true) na vida do cliente."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: total_returned_brl
        data_type: numeric
        description: "Valor total devolvido ao longo da vida do cliente, em BRL."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: return_rate_pct
        data_type: float64
        description: >
          Taxa de devolução do cliente: (pedidos com devolução / total de pedidos entregues) * 100.
          Clientes com return_rate_pct > 30 merecem análise manual.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

      # ── STATUS E FLAGS ────────────────────────────────────────────────────────

      - name: activity_status
        data_type: string
        description: >
          Status de atividade baseado em days_since_last_order:
          active (≤30d) | at_risk (31-60d) | churning (61-90d) | churned (>90d)
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'at_risk', 'churning', 'churned']

      - name: is_repeat_customer
        data_type: boolean
        description: "TRUE se o cliente tem mais de 1 pedido entregue."

      - name: is_active_30d
        data_type: boolean
        description: "TRUE se o cliente fez ao menos 1 pedido entregue nos últimos 30 dias."

      - name: has_returned
        data_type: boolean
        description: "TRUE se o cliente já fez ao menos 1 devolução."

      # ── SCORES RFM ────────────────────────────────────────────────────────────

      - name: r_score
        data_type: int64
        description: >
          Score de Recência (1–3): 3 = comprou recentemente, 1 = faz muito tempo.
          Calculado via percentis p25/p75 da base — auto-ajustável.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
                quote: false

      - name: f_score
        data_type: int64
        description: >
          Score de Frequência (1–3): 3 = compra com alta frequência.
          Calculado via percentis p25/p75 da base.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
                quote: false

      - name: m_score
        data_type: int64
        description: >
          Score Monetário (1–3): 3 = maior LTV.
          Calculado via percentis p25/p75 da base.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
                quote: false

      - name: segment
        data_type: string
        description: >
          Segmento RFM do cliente: champions | loyal | new_customer | promising | at_risk | lost
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['champions', 'loyal', 'new_customer', 'promising', 'at_risk', 'lost']

      # ── AUDITORIA ─────────────────────────────────────────────────────────────

      - name: _generated_at
        data_type: timestamp
        description: "Timestamp de quando esta linha foi gerada pelo dbt. Útil para auditoria no BI."
        constraints:
          - type: not_null
        tests:
          - not_null
