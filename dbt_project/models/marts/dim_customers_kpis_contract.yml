version: 2

models:
  - name: dim_customers_kpis
    description: >
      Dimensão enriquecida de clientes com KPIs de negócio para BI.
      1 linha por customer_id — snapshot diário do estado atual do cliente.
      Cobre RFM, tendência de receita, atividade, devoluções e segmentação automática.

    # ─────────────────────────────────────────────────────────────────────────
    # CONTRATO dbt
    # Com contract: enforced, o dbt valida nome + data_type de CADA coluna
    # declarada abaixo ANTES de materializar a tabela no BigQuery.
    # Se qualquer coluna estiver faltando ou com tipo errado, o build falha
    # com ContractError — nunca chega a escrever dados incorretos.
    #
    # Regras:
    #   • Toda coluna do SELECT final deve estar declarada aqui
    #   • data_type deve bater com o tipo real retornado pelo BigQuery
    #   • Remover ou renomear coluna no SQL → build falha até o contrato ser atualizado
    #   • Mudar tipo (ex: INT64 → STRING) → build falha imediatamente
    # ─────────────────────────────────────────────────────────────────────────
    config:
      contract:
        enforced: true

    columns:

      # ── IDENTIFICAÇÃO ───────────────────────────────────────────────────────

      - name: customer_id
        data_type: int64
        description: "PK — identificador único do cliente."
        constraints:
          - type: not_null
          - type: unique
        tests:
          - not_null
          - unique

      - name: customer_name
        data_type: string
        description: "Nome completo do cliente."
        constraints:
          - type: not_null
        tests:
          - not_null

      - name: email
        data_type: string
        description: "E-mail do cliente."
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique

      - name: city
        data_type: string
        description: "Cidade de cadastro do cliente."

      - name: state
        data_type: string
        description: "Estado de cadastro do cliente (UF)."

      - name: signup_date
        data_type: date
        description: "Data de criação da conta."
        constraints:
          - type: not_null

      # ── RECÊNCIA ────────────────────────────────────────────────────────────

      - name: last_order_date
        data_type: date
        description: "Data do último pedido entregue."
        constraints:
          - type: not_null

      - name: first_order_date
        data_type: date
        description: "Data do primeiro pedido entregue."
        constraints:
          - type: not_null

      - name: days_since_last_order
        data_type: int64
        description: "Dias desde o último pedido entregue até hoje."
        constraints:
          - type: not_null

      - name: customer_lifespan_days
        data_type: int64
        description: "Dias entre o primeiro e o último pedido entregue."

      # ── FREQUÊNCIA ──────────────────────────────────────────────────────────

      - name: total_orders
        data_type: int64
        description: "Total de pedidos entregues na vida do cliente."
        constraints:
          - type: not_null

      - name: active_months
        data_type: int64
        description: "Quantidade de meses distintos com ao menos 1 pedido entregue."

      - name: avg_days_between_orders
        data_type: float64
        description: "Intervalo médio em dias entre pedidos consecutivos. Zero para clientes com apenas 1 pedido."

      # ── MONETÁRIO ───────────────────────────────────────────────────────────

      - name: lifetime_revenue_brl
        data_type: numeric
        description: "Receita total acumulada do cliente (apenas pedidos entregues), em BRL."
        constraints:
          - type: not_null

      - name: avg_order_value_brl
        data_type: numeric
        description: "Ticket médio do cliente ao longo de toda a vida, em BRL."

      - name: max_order_value_brl
        data_type: numeric
        description: "Maior valor de pedido individual entregue, em BRL."

      # ── JANELAS TEMPORAIS ───────────────────────────────────────────────────

      - name: orders_last_30d
        data_type: int64
        description: "Pedidos entregues nos últimos 30 dias."

      - name: revenue_last_30d
        data_type: numeric
        description: "Receita de pedidos entregues nos últimos 30 dias, em BRL."

      - name: orders_last_60d
        data_type: int64
        description: "Pedidos entregues nos últimos 60 dias."

      - name: revenue_last_60d
        data_type: numeric
        description: "Receita de pedidos entregues nos últimos 60 dias, em BRL."

      - name: orders_last_90d
        data_type: int64
        description: "Pedidos entregues nos últimos 90 dias."

      - name: revenue_last_90d
        data_type: numeric
        description: "Receita de pedidos entregues nos últimos 90 dias, em BRL."

      # ── TENDÊNCIA ───────────────────────────────────────────────────────────

      - name: revenue_last_4w
        data_type: numeric
        description: "Receita das últimas 4 semanas, em BRL."

      - name: revenue_prev_4w
        data_type: numeric
        description: "Receita das 4 semanas anteriores, em BRL."

      - name: revenue_trend_pct
        data_type: float64
        description: >
          Variação percentual da receita: (last_4w - prev_4w) / prev_4w * 100.
          Positivo = crescimento. Negativo = queda. NULL = sem histórico anterior.

      # ── DEVOLUÇÕES ──────────────────────────────────────────────────────────

      - name: total_returned_orders
        data_type: int64
        description: "Total de pedidos devolvidos na vida do cliente."

      - name: total_returned_brl
        data_type: numeric
        description: "Valor total devolvido ao longo da vida do cliente, em BRL."

      - name: return_rate_pct
        data_type: float64
        description: "Taxa de devolução: (pedidos devolvidos / total pedidos) * 100."

      # ── STATUS E FLAGS ──────────────────────────────────────────────────────

      - name: activity_status
        data_type: string
        description: "active | at_risk | churning | churned — baseado em days_since_last_order."
        constraints:
          - type: not_null

      - name: is_repeat_customer
        data_type: boolean
        description: "TRUE se o cliente tem mais de 1 pedido entregue."

      - name: is_active_30d
        data_type: boolean
        description: "TRUE se o cliente comprou nos últimos 30 dias."

      - name: has_returned
        data_type: boolean
        description: "TRUE se o cliente já devolveu ao menos 1 pedido."

      # ── SCORES RFM ──────────────────────────────────────────────────────────

      - name: r_score
        data_type: int64
        description: "Score de Recência (1–3): 3 = comprou recentemente."
        constraints:
          - type: not_null

      - name: f_score
        data_type: int64
        description: "Score de Frequência (1–3): 3 = compra com alta frequência."
        constraints:
          - type: not_null

      - name: m_score
        data_type: int64
        description: "Score Monetário (1–3): 3 = maior LTV."
        constraints:
          - type: not_null

      - name: segment
        data_type: string
        description: "Segmento RFM: champions | loyal | new_customer | promising | at_risk | lost"
        constraints:
          - type: not_null

      # ── AUDITORIA ───────────────────────────────────────────────────────────

      - name: _generated_at
        data_type: timestamp
        description: "Timestamp de geração desta linha pelo dbt."
        constraints:
          - type: not_null
